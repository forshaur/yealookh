<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yealookh</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <div class="title-container">
                <h1 class="title">yealookh</h1>
                <p class="subtitle">Generate SVG portfolios for your GitHub profile</p>
            </div>
        </header>

        <section class="form-group">
            <label for="usernameInput" class="sr-only">GitHub Username</label>
            <input type="text" id="usernameInput" class="input" placeholder="Enter GitHub username" autocomplete="off" />
            <button id="fetchBtn" class="button">Fetch Repositories</button>
        </section>

        <div id="errorMsg" class="error" role="alert" style="display: none;"></div>

        <section id="reposSection" style="display: none;" aria-live="polite">
            <div id="reposGrid" class="repos-grid"></div>
            <div class="actions">
                <button id="generateBtn" class="button" disabled>Generate SVG URL</button>
            </div>
        </section>

        <section id="resultSection" class="result-section" style="display: none;" aria-live="polite">
            <h2 class="serif-text">Your Generated URL</h2>
            <div class="url-box">
                <span id="svgUrl"></span>
                <button id="copyBtn" class="button button-small">Copy Link</button>
            </div>
            <img id="previewImage" src="" alt="Preview of your generated GitHub SVG" class="preview-image" />
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
